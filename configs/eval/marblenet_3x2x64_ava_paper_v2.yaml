experiment_name: marblenet_3x2x64_ava_paper_v2_eval
manifest: manifests/ava_speech_paper_manifest.jsonl
algorithm: marblenet_3x2x64
checkpoint: runs/marblenet_3x2x64_ava_paper_v2/checkpoints/best.pt
run_dir: runs/marblenet_3x2x64_ava_paper_v2_eval

features:
  sample_rate: 16000
  frame_ms: 25.0
  hop_ms: 10.0
  n_mels: 64
  n_mfcc: 64
  feature_type: mfcc

eval:
  split: test
  tune_split: val
  tune_threshold: true
  paper_metrics: true
  target_fpr: 0.315
  sliding_window_sec: 0.63
  sliding_overlap: 0.875
  median_smoothing_ms: 310.0

training:
  device: auto

postprocess:
  threshold: auto
  min_speech_ms: 80.0
  min_silence_ms: 160.0
