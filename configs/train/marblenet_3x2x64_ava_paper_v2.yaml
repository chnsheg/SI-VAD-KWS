experiment_name: marblenet_3x2x64_ava_paper_v2
manifest: manifests/ava_speech_paper_manifest.jsonl
algorithm: marblenet_3x2x64
run_dir: runs/marblenet_3x2x64_ava_paper_v2
seed: 7

features:
  sample_rate: 16000
  frame_ms: 25.0
  hop_ms: 10.0
  n_mels: 64
  n_mfcc: 64
  feature_type: mfcc

training:
  epochs: 150
  batch_size: 8
  lr: 0.01
  min_lr: 0.0001
  weight_decay: 0.0001
  optimizer: sgd
  momentum: 0.9
  scheduler: warmup_hold_decay
  warmup_ratio: 0.05
  hold_ratio: 0.45
  class_balanced_sampling: true
  pos_weight: auto
  early_stop_patience: 25
  device: auto
  num_workers: 2
  augment:
    segment_frames: 63
    gain_db: 6.0
    time_shift_frames: 12
    noise_std: 0.03
    freq_masks: 2
    time_masks: 2
    max_freq_mask: 8
    max_time_mask: 24

postprocess:
  threshold: 0.5
  min_speech_ms: 80.0
  min_silence_ms: 160.0
