experiment_name: marblenet_lite_aishell4_realneg
manifest: data/aishell4_realneg_vad/manifest.jsonl
algorithm: marblenet_lite
run_dir: runs/marblenet_lite_aishell4_realneg
seed: 7

features:
  sample_rate: 16000
  frame_ms: 25.0
  hop_ms: 10.0
  n_mels: 64
  n_mfcc: 64
  feature_type: logmel

training:
  epochs: 40
  batch_size: 8
  lr: 0.001
  min_lr: 0.00001
  weight_decay: 0.00001
  optimizer: adamw
  scheduler: cosine
  class_balanced_sampling: false
  pos_weight: 0.7
  early_stop_patience: 8
  device: auto
  num_workers: 0
  log_every_batches: 500
  max_train_batches_per_epoch: 1200
  augment:
    segment_frames: 100
    gain_db: 4.0
    time_shift_frames: 8
    noise_std: 0.01
    freq_masks: 2
    time_masks: 2
    max_freq_mask: 8
    max_time_mask: 20

postprocess:
  threshold: 0.5
  min_speech_ms: 80.0
  min_silence_ms: 160.0
