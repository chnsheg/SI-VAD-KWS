experiment_name: marblenet_lite_yesno
manifest: data/yesno_synth/manifest.jsonl
algorithm: marblenet_lite
run_dir: runs/marblenet_lite_yesno
seed: 7

features:
  sample_rate: 16000
  frame_ms: 25.0
  hop_ms: 10.0
  n_mels: 64
  n_mfcc: 64

training:
